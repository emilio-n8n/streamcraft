# Template — replaced by tools/new-app.py.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v (e.g. 0.1.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            token: linux-x86_64
            archive: tar.gz
            binary: streamcraft
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            token: windows-x64
            archive: zip
            binary: streamcraft.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            token: macos-aarch64
            archive: tar.gz
            binary: streamcraft
          - os: macos-latest
            target: x86_64-apple-darwin
            token: macos-x86_64
            archive: tar.gz
            binary: streamcraft

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Linux windowing dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            libfontconfig1-dev libfreetype6-dev libasound2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build optimized binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          name="streamcraft-${{ steps.version.outputs.version }}-${{ matrix.token }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/$name/"
          cp README.md LICENSE-MIT LICENSE-APACHE AGENTS.md THIRD_PARTY.md LAUNCHER.md "dist/$name/"
          chmod +x "dist/$name/${{ matrix.binary }}"
          tar -C dist -czf "dist/$name.tar.gz" "$name"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "streamcraft-${{ steps.version.outputs.version }}-${{ matrix.token }}-portable"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/$name/"
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE, AGENTS.md, THIRD_PARTY.md, LAUNCHER.md "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip" -Force

      - name: Upload platform archive
        uses: actions/upload-artifact@v4
        with:
          name: streamcraft-${{ matrix.target }}
          path: dist/*.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  metadata:
    name: Launcher metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage manifest and icon
        run: |
          mkdir -p dist
          cp craft-app.json dist/craft-app.json
          cp "assets/streamcraft-128.png" "dist/streamcraft-128.png"
          python3 tools/launcher_check.py .
      - uses: actions/upload-artifact@v4
        with:
          name: streamcraft-metadata
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  checksums:
    name: Generate SHA256SUMS
    needs: [build, metadata]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Compute checksums and validate
        working-directory: dist
        run: |
          set -euo pipefail
          ls -lh
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' \
            | sort | xargs sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..
          python3 tools/launcher_check.py . --release-dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [build, checksums]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List release files
        run: ls -lh dist

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: StreamCraft ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            Scenes, sources and a compositor for local recording

            ### Downloads
            - **Linux x86_64 (portable):** `streamcraft-<version>-linux-x86_64.tar.gz`
            - **Windows x64 (portable):** `streamcraft-<version>-windows-x64-portable.zip`
            - **macOS Apple silicon (portable):** `streamcraft-<version>-macos-aarch64.tar.gz`
            - **macOS Intel (portable):** `streamcraft-<version>-macos-x86_64.tar.gz`

            `craft-app.json` and the application icon are attached for the
            ArtCraft Launcher. Signed MSI, DMG and AppImage packages will follow
            when the signing and packaging pipeline is available.

            ### Verify your download
            ```bash
            sha256sum -c SHA256SUMS.txt
            ```

            StreamCraft is an independent community project.
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/craft-app.json
            dist/streamcraft-128.png
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
